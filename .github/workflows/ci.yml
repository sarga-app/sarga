name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
  workflow_dispatch:

# Read-only by default; jobs grant what they need.
permissions:
  contents: read

# Cancel in-progress runs of the same workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.2"

jobs:
  ci:
    name: build / vet / lint / test / vuln
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Cache goimports binary
        id: cache-goimports
        uses: actions/cache@v5
        with:
          path: ~/go/bin/goimports
          key: goimports-${{ runner.os }}-${{ env.GO_VERSION }}-v0.44.0

      - name: Install goimports (on cache miss)
        if: steps.cache-goimports.outputs.cache-hit != 'true'
        run: go install golang.org/x/tools/cmd/goimports@v0.44.0

      - name: Verify go.mod / go.sum are tidy
        run: make tidy-check

      - name: Format check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.12.1
          args: --timeout=5m

      - name: Test (race + count=1)
        run: make test

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build binary
        run: make build

      - name: Smoke test binary
        run: |
          ./sarga version
          ./sarga --help
          ./sarga healthcheck && exit 1 || true   # expect non-zero (no server)

  docker:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: false
          load: true
          tags: sarga:ci
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name sarga-ci -p 8080:8080 sarga:ci serve
          for i in {1..10}; do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              echo "healthz OK"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "healthz never came up"
              docker logs sarga-ci
              exit 1
            fi
            sleep 1
          done
          docker exec sarga-ci sarga healthcheck
          docker stop sarga-ci
          docker rm sarga-ci
