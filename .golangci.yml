# Strict-ish linter set for sarga (golangci-lint v2 schema).
# Security and correctness are aggressive; style checks moderate.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # ── correctness / bug-finding ──────────────────────────────────────────
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - nilerr
    - errorlint
    - exhaustive
    - contextcheck
    - nilnil
    - copyloopvar
    - predeclared
    - usestdlibvars
    - mirror
    - nestif

    # ── security ───────────────────────────────────────────────────────────
    - gosec

    # ── style / idiom (moderate) ───────────────────────────────────────────
    - misspell
    - revive
    - gocritic
    - prealloc
    - nakedret
    - unconvert
    - unparam

    # ── test hygiene ───────────────────────────────────────────────────────
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - paralleltest

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment       # micro-optimisation; too noisy

    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - io.Copy
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write

    gosec:
      excludes:
        - G104                 # covered by errcheck with better signal
      severity: low
      confidence: low

    staticcheck:
      # Disable comment-mandating checks; project style is minimal comments.
      checks:
        - all
        - -ST1000   # package comment required
        - -ST1020   # exported func comment
        - -ST1021   # exported type comment
        - -ST1022   # exported var/const comment

    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
        - opinionated
      disabled-checks:
        - whyNoLint
        - hugeParam
        - rangeValCopy

    nestif:
      min-complexity: 5

    nakedret:
      max-func-lines: 30

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - revive
          - gocritic
          - unparam

      - path: cmd/sarga/main\.go
        linters:
          - revive
        text: "exit"

      - linters:
          - govet
        text: "printf"

      # Providers return (nil, nil) to signal "not found, not an error" — intentional.
      # The enricher always checks result == nil before use.
      - path: internal/domain/library/provider_
        linters:
          - nilnil

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/sarga-app/sarga
    gofumpt:
      extra-rules: true
      module-path: github.com/sarga-app/sarga

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
