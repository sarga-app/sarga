openapi: 3.0.3
info:
  title: Sarga API
  version: 0.1.0
  description: |
    Native REST API for the Sarga music server. Source of truth for
    `/api/v1/*` routes. OpenSubsonic compatibility (`/rest/*`) is
    documented separately.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
    description: This server

# Default: every operation requires a bearer token. Public endpoints
# (login, refresh, logout) override with `security: []` to opt out.
security:
  - bearerAuth: []

tags:
  - name: auth
    description: Login, session refresh, logout.
  - name: identity
    description: Caller identity.
  - name: libraries
    description: Library management. Write operations require admin role.

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Log in
      description: |
        On success, sets an HttpOnly `sarga_refresh` cookie scoped to
        `/api/v1/auth` and returns a short-lived bearer access token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated. Refresh cookie set.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly `sarga_refresh` cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      security: []
      summary: Rotate session
      description: |
        Reads `sarga_refresh` from the request cookie, revokes it, and issues
        a new pair (cookie + access token). Reuse of a revoked token revokes
        every active session for that user.
      responses:
        '200':
          description: New access token issued; rotated cookie set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: []
      summary: Log out
      description: |
        Idempotent — returns 204 even if no valid session cookie was sent.
        Server-side, the refresh token is revoked and the cookie is cleared.
      responses:
        '204': { description: Logged out. }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /libraries:
    get:
      tags: [libraries]
      operationId: listLibraries
      summary: List libraries
      description: |
        Admins receive all libraries. Non-admins receive only libraries they
        have been granted access to.
      responses:
        '200':
          description: Library list.
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  libraries:
                    type: array
                    items: { $ref: '#/components/schemas/Library' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [libraries]
      operationId: createLibrary
      summary: Create library
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryWrite' }
      responses:
        '201':
          description: Library created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /libraries/{libraryId}:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [libraries]
      operationId: getLibrary
      summary: Get library
      description: |
        Admins can fetch any library. Non-admins can fetch only libraries they
        have been granted access to.
      responses:
        '200':
          description: Library.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [libraries]
      operationId: updateLibrary
      summary: Update library
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryWrite' }
      responses:
        '200':
          description: Updated library.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [libraries]
      operationId: deleteLibrary
      summary: Delete library
      description: Admin only. Also deletes all access grants for this library.
      responses:
        '204': { description: Library deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /libraries/{libraryId}/access:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [libraries]
      operationId: listLibraryMembers
      summary: List library members
      description: Admin only.
      responses:
        '200':
          description: Member list.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/LibraryMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [libraries]
      operationId: grantLibraryAccess
      summary: Grant or update access
      description: Admin only. Upserts the access record (safe to call again to change role).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantAccessRequest' }
      responses:
        '204': { description: Access granted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /libraries/{libraryId}/access/{userId}:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [libraries]
      operationId: revokeLibraryAccess
      summary: Revoke access
      description: Admin only.
      responses:
        '204': { description: Access revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me:
    get:
      tags: [identity]
      operationId: me
      summary: Current user
      description: |
        Returns the user identified by the bearer access token. Useful for
        clients to refresh cached identity after token rotation.
      responses:
        '200':
          description: Caller identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: alice }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
          description: "Short-lived JWT. Send as `Authorization: Bearer <token>`."
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.

    MeResponse:
      type: object
      required: [user_id, is_admin]
      properties:
        user_id: { type: string, format: uuid }
        is_admin: { type: boolean }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: invalid_credentials }
            message: { type: string }

    Library:
      type: object
      required: [id, name, paths, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Main Library" }
        paths:
          type: array
          description: |
            One or more filesystem locations the library scans. Each path
            is unique across the entire server — a path cannot belong to
            two libraries simultaneously.
          items: { type: string, example: "/mnt/music/flac" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LibraryWrite:
      type: object
      required: [name, paths]
      properties:
        name: { type: string, minLength: 1, example: "Main Library" }
        paths:
          type: array
          minItems: 1
          description: |
            Replace-all semantics on update — the supplied list becomes the
            full set of scan paths, any not in the list are removed.
          items: { type: string, minLength: 1, example: "/mnt/music/flac" }

    LibraryMember:
      type: object
      required: [user_id, username, role, granted_at]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string, nullable: true }
        role: { type: string, enum: [viewer, contributor, admin] }
        granted_at: { type: string, format: date-time }

    GrantAccessRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [viewer, contributor, admin] }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient permissions.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Resource already exists or name conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
