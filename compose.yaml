name: sarga-dev

services:
  postgres:
    image: postgres:17.2-alpine
    container_name: sarga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sarga
      POSTGRES_PASSWORD: ${SARGA_DB_PASSWORD:-sarga}
      POSTGRES_DB: sarga
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sarga-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarga -d sarga"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  sarga-pgdata:
