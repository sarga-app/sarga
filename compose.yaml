name: sarga-dev

# Default `docker compose up` runs ONLY postgres — for local Go-based dev
# (`make run`). To also run sarga in a container, use the `prod` profile:
#   docker compose --profile prod up --build

services:
  postgres:
    image: postgres:17.2-alpine
    container_name: sarga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sarga
      POSTGRES_PASSWORD: ${SARGA_DB_PASSWORD:-sarga}
      POSTGRES_DB: sarga
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sarga-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarga -d sarga"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  sarga:
    profiles: [prod]
    build: .
    container_name: sarga
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SARGA_DATABASE_HOST: postgres
      # JWT signing secret is auto-generated at /data/secrets/jwt.key.
      # Override only if injecting via Docker secrets / Vault / external KMS (≥32 bytes):
      # SARGA_AUTH_JWT_SECRET: ${SARGA_AUTH_JWT_SECRET}
    ports:
      - "8080:8080"
    volumes:
      # Container path /data is fixed (standard self-hosted convention).
      # Change the host-side (left of `:`) if you want, never the container-side.
      - sarga-data:/data

volumes:
  sarga-pgdata:    # Postgres data — back this up.
  sarga-data:      # Sarga's data dir (secrets/, certs/, cache/, tmp/) — back up secrets/ + certs/.
