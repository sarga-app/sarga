name: sarga

services:
  postgres:
    container_name: sarga-postgres
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sarga
      POSTGRES_DB: sarga
      POSTGRES_PASSWORD: ${SARGA_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sarga-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  sarga:
    container_name: sarga
    image: ghcr.io/sarga-app/sarga:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - sarga-data:/data

volumes:
  sarga-pgdata:
    name: sarga-pgdata
  sarga-data:
    name: sarga-data
