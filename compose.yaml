name: sarga

services:
  sarga:
    container_name: sarga
    image: ghcr.io/sarga-app/sarga:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - sarga-data:/data
      - /Users/rohan/Music/Library/Sorted/FLAC:/mnt/music

volumes:
  sarga-data:
    name: sarga-data
