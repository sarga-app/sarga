# sarga configuration
#
# Copy this file to config.yaml and edit. Or set values via environment
# variables prefixed with SARGA_ (e.g. SARGA_SERVER_ADDR=:9090).
# Env vars override the file. The file overrides defaults shown below.

server:
  # Address to listen on. Use ":8080" for all interfaces, "127.0.0.1:8080"
  # for localhost only.
  addr: ":8080"

log:
  # One of: debug, info, warn, error
  level: "info"

  # One of: text (human-readable, dev) or json (structured, prod)
  format: "text"

database:
  host: "localhost"
  port: 5432
  user: "sarga"
  name: "sarga"
  password: "sarga"
  sslmode: "disable"
  maxconns: 0           # 0 = auto (2 × GOMAXPROCS)

  # Apply pending schema migrations automatically on `sarga serve` startup.
  # Disable if you run multiple sarga instances and prefer to apply migrations
  # explicitly via `sarga migrate up` from one of them.
  automigrate: true

auth:
  # Required. Generate with: openssl rand -base64 48
  # Set via SARGA_AUTH_JWTSECRET in production; do NOT commit to git.
  jwtsecret: ""

  jwtissuer:    "sarga"
  jwtaudience:  "sarga-web"
  accessttl:    "30m"
  refreshttl:   "720h"   # 30 days
  cookiesecure: true     # set false for plaintext-HTTP local dev
