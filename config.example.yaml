# sarga configuration. Copy to config.yaml and edit, or override any value
# with SARGA_*_* env vars (e.g. SARGA_SERVER_ADDR=:9090).

server:
  addr: ":8080"

log:
  level: "info"      # debug | info | warn | error
  format: "text"     # text | json

database:
  host: "localhost"
  port: 5432
  user: "sarga"
  name: "sarga"
  password: "sarga"
  sslmode: "disable"
  maxconns: 0        # 0 = auto
  automigrate: true

auth:
  jwt:
    # Leave blank — auto-generated on first boot. Set only if injecting from
    # Docker secrets / Vault. Prefer SARGA_AUTH_JWT_SECRET over writing it here.
    secret: ""
