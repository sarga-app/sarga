openapi: 3.1.0
info:
  title: Sarga API
  version: 0.1.0
  summary: Native REST API for the Sarga music server.
  description: |
    Hand-maintained spec. Source of truth for `/api/v1/*` routes.
    OpenSubsonic compatibility (`/rest/*`) is documented separately.
servers:
  - url: /api/v1
    description: This server

tags:
  - name: auth
    description: Login, session refresh, logout.
  - name: identity
    description: Caller identity.

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Exchange username + password for an access token.
      description: |
        On success, sets an HttpOnly `sarga_refresh` cookie scoped to
        `/api/v1/auth` and returns a short-lived bearer access token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated. Refresh cookie set.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly `sarga_refresh` cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh cookie and mint a new access token.
      description: |
        Reads `sarga_refresh` from the request cookie, revokes it, and issues
        a new pair (cookie + access token). Reuse of a revoked token revokes
        every active session for that user.
      responses:
        '200':
          description: New access token issued; rotated cookie set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current refresh token and clear its cookie.
      responses:
        '204': { description: Logged out. }

  /me:
    get:
      tags: [identity]
      summary: Return the caller's user id and admin flag.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Caller identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: alice }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
          description: "Short-lived JWT. Send as `Authorization: Bearer <token>`."
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.

    MeResponse:
      type: object
      required: [user_id, is_admin]
      properties:
        user_id: { type: string, format: uuid }
        is_admin: { type: boolean }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: invalid_credentials }
            message: { type: string }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
