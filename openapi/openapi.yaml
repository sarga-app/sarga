openapi: 3.0.3
info:
  title: Sarga API
  version: 0.1.0
  description: |
    Native REST API for the Sarga music server. Source of truth for
    `/api/v1/*` routes. OpenSubsonic compatibility (`/rest/*`) is
    documented separately.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
    description: This server

# Default: every operation requires a bearer token. Public endpoints
# (login, refresh, logout) override with `security: []` to opt out.
security:
  - bearerAuth: []

tags:
  - name: auth
    description: Login, session refresh, logout.
  - name: identity
    description: Caller identity.
  - name: libraries
    description: Library management. Write operations require admin role.
  - name: scan
    description: Library scan triggers, schedules, and history.
  - name: catalog
    description: Browse albums, artists, tracks, and playlists.
  - name: search
    description: Full-text search across catalog.
  - name: art
    description: Content-addressed cover art and artist image cache.

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Log in
      description: |
        On success, sets an HttpOnly `sarga_refresh` cookie scoped to
        `/api/v1/auth` and returns a short-lived bearer access token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated. Refresh cookie set.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly `sarga_refresh` cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      security: []
      summary: Rotate session
      description: |
        Reads `sarga_refresh` from the request cookie, revokes it, and issues
        a new pair (cookie + access token). Reuse of a revoked token revokes
        every active session for that user.
      responses:
        '200':
          description: New access token issued; rotated cookie set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: []
      summary: Log out
      description: |
        Idempotent — returns 204 even if no valid session cookie was sent.
        Server-side, the refresh token is revoked and the cookie is cleared.
      responses:
        '204': { description: Logged out. }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /libraries:
    get:
      tags: [libraries]
      operationId: listLibraries
      summary: List libraries
      description: |
        Admins receive all libraries. Non-admins receive only libraries they
        have been granted access to.
      responses:
        '200':
          description: Library list.
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  libraries:
                    type: array
                    items: { $ref: '#/components/schemas/Library' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [libraries]
      operationId: createLibrary
      summary: Create library
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryWrite' }
      responses:
        '201':
          description: Library created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /libraries/{libraryId}:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [libraries]
      operationId: getLibrary
      summary: Get library
      description: |
        Admins can fetch any library. Non-admins can fetch only libraries they
        have been granted access to.
      responses:
        '200':
          description: Library.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [libraries]
      operationId: updateLibrary
      summary: Update library
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryWrite' }
      responses:
        '200':
          description: Updated library.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [libraries]
      operationId: deleteLibrary
      summary: Delete library
      description: Admin only. Also deletes all access grants for this library.
      responses:
        '204': { description: Library deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /libraries/{libraryId}/access:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [libraries]
      operationId: listLibraryMembers
      summary: List library members
      description: Admin only.
      responses:
        '200':
          description: Member list.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/LibraryMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [libraries]
      operationId: grantLibraryAccess
      summary: Grant or update access
      description: Admin only. Upserts the access record (safe to call again to change role).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantAccessRequest' }
      responses:
        '204': { description: Access granted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /libraries/{libraryId}/access/{userId}:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [libraries]
      operationId: revokeLibraryAccess
      summary: Revoke access
      description: Admin only.
      responses:
        '204': { description: Access revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Library settings ──────────────────────────────────────────────────────

  /libraries/{libraryId}/settings:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [scan]
      operationId: getLibrarySettings
      summary: Get library settings
      description: Returns the current per-library configuration. Admin only.
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibrarySettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [scan]
      operationId: putLibrarySettings
      summary: Update library settings
      description: Admin only. Full replace — send the entire settings object.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibrarySettingsWrite' }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibrarySettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Invalid setting value (e.g. bad cron expression).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Scan triggers and history ─────────────────────────────────────────────

  /libraries/{libraryId}/scan:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [scan]
      operationId: triggerScan
      summary: Start a scan
      description: |
        Queues a full scan of all library paths. Returns 202 immediately.
        Returns 409 if a scan is already running for this library.
      responses:
        '202':
          description: Scan accepted.
          content:
            application/json:
              schema:
                type: object
                required: [scan_run_id]
                properties:
                  scan_run_id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /libraries/{libraryId}/scan-runs:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/Page' }
      - { $ref: '#/components/parameters/Limit' }
    get:
      tags: [scan]
      operationId: listScanRuns
      summary: List scan history
      description: Paginated, newest first.
      responses:
        '200':
          description: Scan history.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ScanRun' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /libraries/{libraryId}/scan-runs/{runId}:
    parameters:
      - name: libraryId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [scan]
      operationId: getScanRun
      summary: Get a scan run
      description: Returns detail for a single scan run including stats and error list.
      responses:
        '200':
          description: Scan run detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Catalog: albums ───────────────────────────────────────────────────────

  /albums:
    get:
      tags: [catalog]
      operationId: listAlbums
      summary: List albums
      description: Paginated album grid. Sorted by date, title, or date added. Optionally filtered to compilations only or collapsed by release group.
      parameters:
        - name: library_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: artist_id
          in: query
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema: { type: string, enum: [date, title, added], default: date }
        - name: compilations_only
          in: query
          schema: { type: boolean, default: false }
        - name: group_by_release_group
          in: query
          description: Collapse editions of the same abstract album into one entry.
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated album list.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Album' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /albums/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/Page' }
      - { $ref: '#/components/parameters/Limit' }
    get:
      tags: [catalog]
      operationId: getAlbum
      summary: Get album detail
      description: Returns the release with a paginated tracklist.
      parameters:
        - name: library_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Album detail with tracks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlbumDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Catalog: artists ──────────────────────────────────────────────────────

  /artists:
    get:
      tags: [catalog]
      operationId: listArtists
      summary: List artists
      description: |
        Alphabetical. Various Artists pseudo-artist is excluded — access
        compilations via `GET /albums?compilations_only=true`.
      parameters:
        - name: library_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated artist list.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Artist' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /artists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [catalog]
      operationId: getArtist
      summary: Get artist detail
      description: Returns artist metadata (bio, career span, country) with a paginated discography grid scoped to the caller's library.
      parameters:
        - name: library_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Artist with bio and paginated discography.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Catalog: tracks ───────────────────────────────────────────────────────

  /tracks:
    get:
      tags: [catalog]
      operationId: listTracks
      summary: List tracks
      description: Flat paginated track list. Filter by library, album, or artist.
      parameters:
        - name: library_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: album_id
          in: query
          schema: { type: string, format: uuid }
        - name: artist_id
          in: query
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated track list.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Track' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Catalog: playlists ────────────────────────────────────────────────────

  /playlists:
    get:
      tags: [catalog]
      operationId: listPlaylists
      summary: List playlists
      description: Paginated list of playlists in the library. In Phase 2 these are read-only M3U imports.
      parameters:
        - name: library_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated playlist list.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Playlist' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /playlists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [catalog]
      operationId: getPlaylist
      summary: Get playlist detail
      description: Returns playlist metadata with a paginated tracklist.
      parameters:
        - name: library_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Playlist with paginated tracklist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Search ────────────────────────────────────────────────────────────────

  /search:
    get:
      tags: [search]
      operationId: search
      summary: Search catalog
      description: |
        FTS5 trigram search. Results grouped by type (albums, artists,
        tracks). Each group is independently paginated.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: library_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Grouped search results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /public/art/{hash}:
    servers:
      - url: /
        description: Root — this route is mounted at / not /api/v1
    get:
      tags: [art]
      operationId: getArt
      security: []
      summary: Serve cover art
      description: |
        Serves a cached image file by its SHA-256 content hash. Mounted at
        `/public/art/{hash}`, not under `/api/v1`. No authentication required —
        the hash itself is the capability token (256-bit preimage resistance
        makes enumeration infeasible).

        Responses are permanently cacheable: `Cache-Control: public,
        max-age=31536000, immutable`. Clients and CDNs may cache forever;
        the URL changes only when the image content changes.
      parameters:
        - name: hash
          in: path
          required: true
          description: SHA-256 hex digest of the image file (64 lowercase hex chars).
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
            example: a3f1e2b4c5d6e7f8a3f1e2b4c5d6e7f8a3f1e2b4c5d6e7f8a3f1e2b4c5d6e7f8
      responses:
        '200':
          description: Image file.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=31536000, immutable
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '404':
          description: Hash not found or invalid format.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me:
    get:
      tags: [identity]
      operationId: me
      summary: Current user
      description: |
        Returns the user identified by the bearer access token. Useful for
        clients to refresh cached identity after token rotation.
      responses:
        '200':
          description: Caller identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/server/settings:
    get:
      operationId: getServerSettings
      summary: Get server settings
      description: |
        Returns global server settings. Secret values are never returned in plaintext;
        only `*_set` booleans indicate whether each is configured.
      tags: [Server]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current server settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateServerSettings
      summary: Update server settings (admin only)
      description: |
        Partially update server settings. Provide only the fields to change.
        Secret fields accept plaintext on write; pass `""` to clear.
      tags: [Server]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServerSettingsPatch' }
      responses:
        '200':
          description: Updated server settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: alice }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
          description: "Short-lived JWT. Send as `Authorization: Bearer <token>`."
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.

    MeResponse:
      type: object
      required: [user_id, is_admin]
      properties:
        user_id: { type: string, format: uuid }
        is_admin: { type: boolean }

    # ── Server settings ──────────────────────────────────────────────────────

    ServerSettings:
      type: object
      required:
        - art_thumb_cache_mb
        - art_thumb_cache_used_bytes
        - lastfm_api_key_set
        - lastfm_secret_set
        - fanart_api_key_set
        - acoustid_api_key_set
        - discogs_token_set
      properties:
        art_thumb_cache_mb:         { type: integer, minimum: 50 }
        art_thumb_cache_used_bytes: { type: integer, format: int64 }
        lastfm_api_key_set:         { type: boolean }
        lastfm_secret_set:          { type: boolean }
        fanart_api_key_set:         { type: boolean }
        acoustid_api_key_set:       { type: boolean }
        discogs_token_set:          { type: boolean }

    ServerSettingsPatch:
      type: object
      description: |
        Partial update — only present fields are changed.
        Secret fields accept plaintext on write; pass `""` to clear.
      properties:
        art_thumb_cache_mb: { type: integer, minimum: 50 }
        lastfm_api_key:     { type: string }
        lastfm_secret:      { type: string }
        fanart_api_key:     { type: string }
        acoustid_api_key:   { type: string }
        discogs_token:      { type: string }

    Pagination:
      type: object
      required: [page, limit, total, total_pages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    # ── Scan ─────────────────────────────────────────────────────────────────

    LibrarySettings:
      type: object
      required:
        - scan_on_create
        - watch_for_changes
        - follow_symlinks
        - scan_playlist_files
        - enable_musicbrainz
        - enable_acoustid
        - enable_discogs
        - match_confidence_threshold
        - metadata_language
        - extensions
        - album_art_priority
        - artist_image_priority
        - format_preference
      properties:
        scan_on_create: { type: boolean, default: true }
        watch_for_changes: { type: boolean, default: true }
        scan_schedule:
          type: string
          nullable: true
          description: Cron expression (6-field with seconds). Null = no schedule.
          example: '0 0 3 * * *'
        follow_symlinks: { type: boolean, default: true }
        scan_playlist_files: { type: boolean, default: true }
        extensions:
          type: array
          items: { type: string }
          example: ['.flac', '.mp3', '.m4a']
        enable_musicbrainz: { type: boolean, default: true }
        enable_acoustid: { type: boolean, default: true }
        enable_discogs: { type: boolean, default: true }
        match_confidence_threshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0.85
        metadata_language: { type: string, default: 'en' }
        album_art_priority:
          type: array
          items: { type: string }
          example: ['embedded', 'folder', 'caa', 'discogs', 'theaudiodb']
        artist_image_priority:
          type: array
          items: { type: string }
          example: ['theaudiodb', 'fanart', 'lastfm']
        format_preference:
          type: array
          items: { type: string }
          example: ['flac', 'alac', 'wav', 'aiff', 'opus', 'ogg', 'aac', 'mp3']

    LibrarySettingsWrite:
      type: object
      properties:
        scan_on_create: { type: boolean }
        watch_for_changes: { type: boolean }
        scan_schedule: { type: string, nullable: true }
        follow_symlinks: { type: boolean }
        scan_playlist_files: { type: boolean }
        extensions:
          type: array
          items: { type: string }
        enable_musicbrainz: { type: boolean }
        enable_acoustid: { type: boolean }
        enable_discogs: { type: boolean }
        match_confidence_threshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
        metadata_language: { type: string }
        album_art_priority:
          type: array
          items: { type: string }
        artist_image_priority:
          type: array
          items: { type: string }
        format_preference:
          type: array
          items: { type: string }

    ScanRun:
      type: object
      required:
        - id
        - library_id
        - started_at
        - status
        - files_scanned
        - files_added
        - files_updated
        - files_removed
        - files_unchanged
        - files_errored
        - total_files
      properties:
        id: { type: string, format: uuid }
        library_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [running, completed, failed] }
        files_scanned: { type: integer }
        files_added: { type: integer }
        files_updated: { type: integer }
        files_removed: { type: integer }
        files_unchanged: { type: integer }
        files_errored: { type: integer }
        total_files: { type: integer }
        pct_complete:
          type: number
          format: float
          description: Computed. 0–100. Null when total_files is 0.
          nullable: true
        error: { type: string, nullable: true }

    # ── Catalog: albums ───────────────────────────────────────────────────────

    Album:
      type: object
      required: [id, title, release_group_id, release_type, is_compilation]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        edition_notes: { type: string, nullable: true }
        release_date: { type: string, nullable: true, example: '2011-09-12' }
        label_name: { type: string, nullable: true }
        release_type:
          type: string
          enum: [album, ep, single, compilation, live, remix, other]
          nullable: true
        release_group_id: { type: string, format: uuid }
        primary_artist_id: { type: string, format: uuid, nullable: true }
        primary_artist_name: { type: string, nullable: true }
        is_compilation: { type: boolean }
        cover_art_hash:
          type: string
          nullable: true
          description: SHA-256 hex hash. Serve via `GET /public/art/{hash}`.

    AlbumTrack:
      type: object
      required: [track_id, disc_number, position, title, is_lossless, is_preferred, match_source, match_confidence]
      properties:
        track_id: { type: string, format: uuid }
        track_file_id: { type: string, format: uuid, nullable: true }
        disc_number: { type: integer }
        position: { type: integer }
        title: { type: string }
        duration_ms: { type: integer, nullable: true }
        format: { type: string, nullable: true, example: flac }
        codec: { type: string, nullable: true }
        is_lossless: { type: boolean }
        is_preferred: { type: boolean }
        match_source:
          type: string
          enum: [mbid_tag, mb_fuzzy, discogs_tag, discogs_fuzzy, acoustid, raw]
        match_confidence: { type: number, format: float }
        version_count:
          type: integer
          description: Number of track_files for this track in the library.

    AlbumDetail:
      allOf:
        - $ref: '#/components/schemas/Album'
        - type: object
          required: [tracks, pagination]
          properties:
            country: { type: string, nullable: true }
            catalog_number: { type: string, nullable: true }
            total_discs: { type: integer, nullable: true }
            tracks:
              type: array
              items: { $ref: '#/components/schemas/AlbumTrack' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    # ── Catalog: artists ──────────────────────────────────────────────────────

    Artist:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sort_name: { type: string, nullable: true }
        mbid: { type: string, nullable: true }
        country: { type: string, nullable: true }
        release_count: { type: integer }
        track_count: { type: integer }

    ArtistDetail:
      allOf:
        - $ref: '#/components/schemas/Artist'
        - type: object
          required: [releases, pagination]
          properties:
            bio: { type: string, nullable: true }
            begin_year: { type: integer, nullable: true }
            end_year: { type: integer, nullable: true }
            releases:
              type: array
              items: { $ref: '#/components/schemas/Album' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    # ── Catalog: tracks ───────────────────────────────────────────────────────

    Track:
      type: object
      required: [id, title, match_source, match_confidence]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        duration_ms: { type: integer, nullable: true }
        format: { type: string, nullable: true }
        codec: { type: string, nullable: true }
        is_lossless: { type: boolean, nullable: true }
        primary_artist_id: { type: string, format: uuid, nullable: true }
        primary_artist_name: { type: string, nullable: true }
        release_id: { type: string, format: uuid, nullable: true }
        release_title: { type: string, nullable: true }
        match_source:
          type: string
          enum: [mbid_tag, mb_fuzzy, discogs_tag, discogs_fuzzy, acoustid, raw]
        match_confidence: { type: number, format: float }

    # ── Catalog: playlists ────────────────────────────────────────────────────

    Playlist:
      type: object
      required: [id, name, track_count, is_public]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        track_count: { type: integer }
        is_public: { type: boolean }

    PlaylistTrack:
      type: object
      required: [position, track_id, title]
      properties:
        position: { type: integer }
        track_id: { type: string, format: uuid }
        title: { type: string }
        duration_ms: { type: integer, nullable: true }
        format: { type: string, nullable: true }
        codec: { type: string, nullable: true }
        is_lossless: { type: boolean, nullable: true }
        is_preferred: { type: boolean, nullable: true }

    PlaylistDetail:
      allOf:
        - $ref: '#/components/schemas/Playlist'
        - type: object
          required: [tracks, pagination]
          properties:
            tracks:
              type: array
              items: { $ref: '#/components/schemas/PlaylistTrack' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    # ── Search ────────────────────────────────────────────────────────────────

    SearchResultGroup:
      type: object
      required: [total]
      properties:
        total: { type: integer }
        pagination: { $ref: '#/components/schemas/Pagination' }

    SearchResults:
      type: object
      required: [query, albums, artists, tracks]
      properties:
        query: { type: string }
        albums:
          allOf:
            - $ref: '#/components/schemas/SearchResultGroup'
            - type: object
              properties:
                data:
                  type: array
                  items: { $ref: '#/components/schemas/Album' }
        artists:
          allOf:
            - $ref: '#/components/schemas/SearchResultGroup'
            - type: object
              properties:
                data:
                  type: array
                  items: { $ref: '#/components/schemas/Artist' }
        tracks:
          allOf:
            - $ref: '#/components/schemas/SearchResultGroup'
            - type: object
              properties:
                data:
                  type: array
                  items: { $ref: '#/components/schemas/Track' }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: invalid_credentials }
            message: { type: string }

    Library:
      type: object
      required: [id, name, paths, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Main Library" }
        paths:
          type: array
          description: |
            One or more filesystem locations the library scans. Each path
            is unique across the entire server — a path cannot belong to
            two libraries simultaneously.
          items: { type: string, example: "/mnt/music/flac" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LibraryWrite:
      type: object
      required: [name, paths]
      properties:
        name: { type: string, minLength: 1, example: "Main Library" }
        paths:
          type: array
          minItems: 1
          description: |
            Replace-all semantics on update — the supplied list becomes the
            full set of scan paths, any not in the list are removed.
          items: { type: string, minLength: 1, example: "/mnt/music/flac" }

    LibraryMember:
      type: object
      required: [user_id, username, role, granted_at]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string, nullable: true }
        role: { type: string, enum: [viewer, contributor, admin] }
        granted_at: { type: string, format: date-time }

    GrantAccessRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [viewer, contributor, admin] }

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient permissions.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Resource already exists or name conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Request body failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
