version: "2"
sql:
  - engine: "sqlite"
    schema: "migrations"
    queries: "internal/support/db/sql"
    gen:
      go:
        package: "queries"
        sql_package: "database/sql"
        out: "internal/support/db/queries"
        emit_interface: false
        emit_json_tags: false
        emit_prepared_queries: false
        emit_pointers_for_null_types: true
        omit_unused_structs: false
        overrides:
          - column: "users.is_admin"
            go_type: "bool"
          - column: "track_files.is_lossless"
            go_type: "bool"
          - column: "track_files.is_preferred"
            go_type: "bool"
          - column: "cover_art.is_preferred"
            go_type: "bool"
          - column: "lyrics.is_synced"
            go_type: "bool"
          - column: "playlists.is_public"
            go_type: "bool"
          - column: "scrobble_targets.enabled"
            go_type: "bool"
          - column: "listening_events.completed"
            go_type: "bool"
          - column: "artists.is_various_artists"
            go_type: "bool"
          - column: "library_settings.scan_on_add"
            go_type: "bool"
          - column: "library_settings.fsnotify_enabled"
            go_type: "bool"
          - column: "library_settings.follow_symlinks"
            go_type: "bool"
          - column: "library_settings.scan_playlist_files"
            go_type: "bool"
          - column: "library_settings.mb_enrichment_enabled"
            go_type: "bool"
          - column: "library_settings.acoustid_enabled"
            go_type: "bool"
          - column: "library_settings.discogs_enabled"
            go_type: "bool"
