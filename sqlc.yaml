version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/platform/db/sql/queries"
    gen:
      go:
        package: "queries"
        sql_package: "pgx/v5"
        out: "internal/platform/db/queries"
        emit_interface: false
        emit_json_tags: false
        emit_prepared_queries: false
        emit_pointers_for_null_types: true
        omit_unused_structs: false
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
